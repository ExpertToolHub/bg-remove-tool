<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qunvero — AI Background Remover</title>
<style>
:root {
  --bg: #0b0d12;
  --bg2: #12151c;
  --bg3: #1a1f2b;
  --border: #242a38;
  --text: #e7ecf3;
  --dim: #8892a6;
  --accent: #6c5ce7;
  --accent2: #8b7cf0;
  --success: #00c896;
  --danger: #ff5470;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  padding: 15px;
  min-height: 100vh;
}
.header {
  max-width: 1200px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 18px;
}
.logo { font-size: 18px; font-weight: 700; color: var(--text); }
.logo span { color: var(--accent); }
.badge {
  font-size: 11px;
  color: var(--dim);
  background: var(--bg3);
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
}
.hero { text-align: center; padding: 20px 15px 25px; max-width: 800px; margin: 0 auto; }
.hero h1 { font-size: clamp(24px, 5vw, 38px); font-weight: 700; letter-spacing: -1px; margin-bottom: 10px; }
.hero h1 span { color: var(--accent); }
.hero p { color: var(--dim); font-size: 14px; }

/* Mode selector */
.mode-selector {
  max-width: 800px;
  margin: 0 auto 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.mode-btn {
  background: var(--bg2);
  border: 2px solid var(--border);
  color: var(--text);
  padding: 15px;
  border-radius: 14px;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.mode-btn:hover { border-color: var(--accent); }
.mode-btn.active {
  border-color: var(--accent);
  background: linear-gradient(135deg, rgba(108,92,231,0.15), rgba(139,124,240,0.05));
  box-shadow: 0 0 20px rgba(108,92,231,0.2);
}
.mode-btn strong { font-size: 14px; font-weight: 700; }
.mode-btn small { font-size: 11px; color: var(--dim); }
.mode-btn.active strong { color: var(--accent2); }

.dropzone {
  max-width: 800px;
  margin: 0 auto;
  background: var(--bg2);
  border: 2px dashed var(--border);
  border-radius: 18px;
  padding: 50px 25px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
}
.dropzone:hover, .dropzone.drag {
  border-color: var(--accent);
  background: var(--bg3);
  transform: translateY(-2px);
  box-shadow: 0 10px 40px rgba(108,92,231,0.3);
}
.dropzone svg { width: 56px; height: 56px; color: var(--accent); margin-bottom: 16px; }
.dropzone h3 { font-size: 17px; margin-bottom: 8px; }
.dropzone p { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
.dropzone-meta { color: var(--dim); font-size: 11px; margin-top: 12px; }

.btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 12px 26px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.btn:hover { background: var(--accent2); }

.status {
  max-width: 800px;
  margin: 15px auto;
  padding: 12px 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  text-align: center;
  font-size: 13px;
  color: var(--dim);
}
.status.success { color: var(--success); }
.status.error { color: var(--danger); }

.progress {
  max-width: 800px;
  margin: 12px auto;
  height: 6px;
  background: var(--bg3);
  border-radius: 3px;
  overflow: hidden;
  display: none;
}
.progress.active { display: block; }
.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width 0.3s;
}

.editor { max-width: 1200px; margin: 15px auto; display: none; }
.editor.active { display: block; }
.editor-grid { display: grid; grid-template-columns: 1fr 340px; gap: 15px; }

.canvas-wrap {
  background: var(--bg2);
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
}
.toolbar {
  display: flex;
  gap: 6px;
  padding: 10px 12px;
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  align-items: center;
  flex-wrap: wrap;
}
.tool-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text);
  padding: 6px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
}
.tool-btn:hover { background: var(--border); }
.tool-btn.active { background: var(--accent); }
.divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

.canvas-stage {
  flex: 1;
  min-height: 400px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
  position: relative;
  background-image:
    linear-gradient(45deg, #161a24 25%, transparent 25%),
    linear-gradient(-45deg, #161a24 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #161a24 75%),
    linear-gradient(-45deg, transparent 75%, #161a24 75%);
  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0;
  overflow: auto;
}
canvas#mainCanvas {
  max-width: 100%;
  max-height: 60vh;
  cursor: crosshair;
  display: block;
}
.brush-controls {
  display: none;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg3);
  border-top: 1px solid var(--border);
  align-items: center;
}
.brush-controls.active { display: flex; }
.brush-controls input[type=range] { flex: 1; accent-color: var(--accent); }
.brush-controls label { font-size: 11px; color: var(--dim); }

.side-panel {
  background: var(--bg2);
  border-radius: 18px;
  border: 1px solid var(--border);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 100px);
}
.tabs {
  display: flex;
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
}
.tab {
  flex: 1;
  padding: 12px 8px;
  background: transparent;
  border: none;
  color: var(--dim);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  font-family: inherit;
}
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.panel { display: none; padding: 15px; overflow-y: auto; flex: 1; }
.panel.active { display: block; }
.panel h4 { font-size: 11px; color: var(--dim); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1.5px; }
.group { margin-bottom: 15px; }
.group label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 7px; }
.group input[type=range] { width: 100%; accent-color: var(--accent); }
.group input[type=color] {
  width: 100%;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg3);
  cursor: pointer;
}
.group select {
  width: 100%;
  padding: 9px;
  background: var(--bg3);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
  font-size: 12px;
}
.group.row { display: flex; justify-content: space-between; align-items: center; }
.switch {
  width: 42px;
  height: 22px;
  appearance: none;
  background: var(--border);
  border-radius: 11px;
  position: relative;
  cursor: pointer;
  transition: 0.2s;
}
.switch:checked { background: var(--accent); }
.switch::after {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  top: 3px;
  left: 3px;
  transition: 0.2s;
}
.switch:checked::after { left: 23px; }

.bg-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.bg-swatch {
  aspect-ratio: 1;
  border-radius: 8px;
  border: 2px solid var(--border);
  cursor: pointer;
  padding: 0;
  overflow: hidden;
  background: var(--bg3);
}
.bg-swatch.active { border-color: var(--accent); box-shadow: 0 0 12px rgba(108,92,231,0.3); }
.bg-swatch > span { display: block; width: 100%; height: 100%; }
.checker {
  background-image:
    linear-gradient(45deg, #444 25%, transparent 25%),
    linear-gradient(-45deg, #444 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #444 75%),
    linear-gradient(-45deg, transparent 75%, #444 75%);
  background-size: 12px 12px;
  background-position: 0 0, 0 6px, 6px -6px, -6px 0;
  background-color: #888;
}

.dl-btns { display: flex; flex-direction: column; gap: 8px; }
.dl-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  border: none;
  padding: 12px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.dl-btn.alt { background: var(--bg3); border: 1px solid var(--border); }

.log {
  max-width: 1200px;
  margin: 12px auto;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  font-family: monospace;
  font-size: 10px;
  color: var(--accent2);
  max-height: 80px;
  overflow-y: auto;
}
.log div { padding: 1px 0; }

@media (max-width: 900px) {
  .editor-grid { grid-template-columns: 1fr; }
  .canvas-stage { min-height: 320px; }
  .side-panel { max-height: none; }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Qunvero<span>.</span></div>
  <div class="badge">🔒 100% Browser · Free</div>
</div>

<div class="hero">
  <h1>AI Background <span>Remover</span></h1>
  <p>Cutout mode: 5-10 sec · Pro mode: 30-40 sec · HD quality</p>
</div>

<div class="mode-selector" id="modeSelector">
  <button class="mode-btn active" data-mode="cutout" type="button">
    <strong>⚡ Cutout (Fast)</strong>
    <small>5-10 sec · Simple backgrounds</small>
  </button>
  <button class="mode-btn" data-mode="pro" type="button">
    <strong>✨ Pro (HD)</strong>
    <small>30-40 sec · Complex edges</small>
  </button>
</div>

<div class="dropzone" id="dropzone">
  <input type="file" id="fileInput" accept="image/*" style="display:none;">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="17 8 12 3 7 8"/>
    <line x1="12" y1="3" x2="12" y2="15"/>
  </svg>
  <h3>Photo Upload Karein</h3>
  <p>Drag & drop ya click karein</p>
  <button class="btn" id="uploadBtn" type="button">Upload Photo</button>
  <div class="dropzone-meta">JPG · PNG · WEBP</div>
</div>

<div class="status" id="status">⏳ AI model load ho raha hai...</div>
<div class="progress" id="progress"><div class="progress-fill" id="progressFill"></div></div>

<div class="editor" id="editor">
  <div class="editor-grid">
    <div class="canvas-wrap">
      <div class="toolbar">
        <button class="tool-btn" id="toolBrush">🖌️ Erase</button>
        <button class="tool-btn" id="toolRestore">✨ Restore</button>
        <span class="divider"></span>
        <button class="tool-btn" id="toolUndo">↶</button>
        <button class="tool-btn" id="toolRedo">↷</button>
        <button class="tool-btn" id="toolCompare">◐</button>
        <button class="tool-btn" id="toolZoomOut">−</button>
        <span class="tool-btn" id="zoomLevel" style="cursor:default">100%</span>
        <button class="tool-btn" id="toolZoomIn">+</button>
        <span class="divider"></span>
        <button class="tool-btn" id="toolNew">🔄 New</button>
      </div>
      <div class="canvas-stage">
        <canvas id="mainCanvas"></canvas>
      </div>
      <div class="brush-controls" id="brushControls">
        <label>Brush: <span id="brushSizeVal">30</span>px</label>
        <input type="range" id="brushSize" min="5" max="100" value="30">
      </div>
    </div>

    <div class="side-panel">
      <div class="tabs">
        <button class="tab active" data-tab="bg">BG</button>
        <button class="tab" data-tab="adjust">Adjust</button>
        <button class="tab" data-tab="enhance">Enhance</button>
        <button class="tab" data-tab="export">Export</button>
      </div>

      <div class="panel active" data-panel="bg">
        <h4>🎨 Background</h4>
        <div class="bg-grid">
          <button class="bg-swatch active" data-bg="transparent"><span class="checker"></span></button>
          <button class="bg-swatch" data-bg="white"><span style="background:#fff"></span></button>
          <button class="bg-swatch" data-bg="black"><span style="background:#000"></span></button>
          <button class="bg-swatch" data-bg="custom"><span style="background:linear-gradient(135deg,#ff6b6b,#feca57,#48dbfb)"></span></button>
          <button class="bg-swatch" data-bg="gradient"><span style="background:linear-gradient(135deg,#667eea,#764ba2)"></span></button>
          <button class="bg-swatch" data-bg="blue"><span style="background:#4a90e2"></span></button>
          <button class="bg-swatch" data-bg="blur"><span style="background:linear-gradient(135deg,#8892a6,#242a38)"></span></button>
          <button class="bg-swatch" data-bg="upload">📁</button>
        </div>
        <div class="group" id="gCustom" style="display:none">
          <label>Custom Color</label>
          <input type="color" id="customColor" value="#4a90e2">
        </div>
        <div class="group" id="gGradient" style="display:none">
          <label>From</label>
          <input type="color" id="gradFrom" value="#667eea">
          <label style="margin-top:8px">To</label>
          <input type="color" id="gradTo" value="#764ba2">
        </div>
        <div class="group" id="gUpload" style="display:none">
          <label>BG Image</label>
          <input type="file" id="bgImageInput" accept="image/*">
        </div>
        <div class="group" id="gBlur" style="display:none">
          <label>Blur: <span id="blurVal">15</span>px</label>
          <input type="range" id="blurRange" min="0" max="40" value="15">
        </div>
      </div>

      <div class="panel" data-panel="adjust">
        <h4>🎯 Subject Adjust</h4>
        <div class="group">
          <label>Scale: <span id="scaleVal">100</span>%</label>
          <input type="range" id="scaleRange" min="30" max="200" value="100">
        </div>
        <div class="group">
          <label>Position X</label>
          <input type="range" id="posX" min="-50" max="50" value="0">
        </div>
        <div class="group">
          <label>Position Y</label>
          <input type="range" id="posY" min="-50" max="50" value="0">
        </div>
      </div>

      <div class="panel" data-panel="enhance">
        <h4>✨ Auto Enhance</h4>
        <div class="group row">
          <label style="margin:0">Auto Enhance</label>
          <input type="checkbox" id="enhanceToggle" class="switch" checked>
        </div>
        <div class="group">
          <label>Sharpness: <span id="sharpVal">25</span></label>
          <input type="range" id="sharpRange" min="0" max="50" value="25">
        </div>
        <div class="group">
          <label>Contrast: <span id="contrastVal">6</span>%</label>
          <input type="range" id="contrastRange" min="0" max="30" value="6">
        </div>
        <div class="group">
          <label>Saturation: <span id="satVal">8</span>%</label>
          <input type="range" id="satRange" min="0" max="30" value="8">
        </div>
        <div class="group row">
          <label style="margin:0">Halo Removal</label>
          <input type="checkbox" id="haloToggle" class="switch" checked>
        </div>
        <div class="group row">
          <label style="margin:0">Edge Feather</label>
          <input type="checkbox" id="featherToggle" class="switch" checked>
        </div>
        <div class="group">
          <label>HD Upscale</label>
          <select id="upscaleSel">
            <option value="1" selected>1x Original</option>
            <option value="2">2x HD</option>
            <option value="3">3x Ultra</option>
          </select>
        </div>
      </div>

      <div class="panel" data-panel="export">
        <h4>💾 Download</h4>
        <div class="group">
          <label>Format</label>
          <select id="exportFormat">
            <option value="png">PNG (Transparent)</option>
            <option value="jpg">JPG</option>
            <option value="webp">WEBP</option>
          </select>
        </div>
        <div class="group">
          <label>Quality: <span id="qualityVal">95</span>%</label>
          <input type="range" id="qualityRange" min="70" max="100" value="95">
        </div>
        <div class="dl-btns">
          <button class="dl-btn" id="dlBtn">⬇ Download</button>
          <button class="dl-btn alt" id="dlPrintBtn">🖨 Print</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="log" id="log"></div>

<script type="module">
var currentMode = 'cutout';

var MODES = {
  cutout: { processSize: 512, upscale: 1, enhance: false, model: 'small' },
  pro:    { processSize: 1024, upscale: 2, enhance: true, model: 'medium' }
};

var dropzone, fileInput, uploadBtn, statusEl, progress, progressFill, editor, mainCanvas;
var removeBgFn = null;

var state = {
  originalImage: null,
  cutoutImage: null,
  bgType: 'transparent',
  customColor: '#4a90e2',
  gradFrom: '#667eea',
  gradTo: '#764ba2',
  bgImage: null,
  blurAmount: 15,
  scale: 100,
  posX: 0,
  posY: 0,
  enhance: false,
  sharpness: 25,
  contrast: 6,
  saturation: 8,
  haloRemoval: true,
  feather: true,
  upscale: 1,
  exportFormat: 'png',
  jpgQuality: 0.95,
  brushMode: 'none',
  brushSize: 30,
  zoom: 1,
  history: [],
  historyIndex: -1
};

function log(msg) {
  var el = document.getElementById('log');
  if (el) {
    var d = document.createElement('div');
    d.textContent = '> ' + msg;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
  }
  console.log(msg);
}

window.addEventListener('load', function() {
  dropzone = document.getElementById('dropzone');
  fileInput = document.getElementById('fileInput');
  uploadBtn = document.getElementById('uploadBtn');
  statusEl = document.getElementById('status');
  progress = document.getElementById('progress');
  progressFill = document.getElementById('progressFill');
  editor = document.getElementById('editor');
  mainCanvas = document.getElementById('mainCanvas');

  log('Loading AI library...');

  import('https://esm.sh/@imgly/background-removal@1.5.5')
    .then(function(mod) {
      if (mod.removeBackground) removeBgFn = mod.removeBackground;
      else if (mod.default && mod.default.removeBackground) removeBgFn = mod.default.removeBackground;
      if (removeBgFn) {
        log('✅ AI ready');
        statusEl.textContent = '✅ Ready! Photo upload karein.';
        statusEl.className = 'status success';
      }
    })
    .catch(function(err) {
      log('❌ ' + err.message);
      statusEl.textContent = '❌ Load fail: ' + err.message;
      statusEl.className = 'status error';
    });

  // Mode selector
  document.querySelectorAll('.mode-btn').forEach(function(btn) {
    btn.onclick = function() {
      document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      currentMode = this.dataset.mode;
      var m = MODES[currentMode];
      state.enhance = m.enhance;
      state.upscale = m.upscale;
      document.getElementById('enhanceToggle').checked = m.enhance;
      document.getElementById('upscaleSel').value = m.upscale;
      log('Mode: ' + currentMode);
    };
  });

  dropzone.onclick = function(e) {
    if (e.target.tagName !== 'BUTTON') fileInput.click();
  };
  uploadBtn.onclick = function(e) {
    e.stopPropagation();
    fileInput.click();
  };
  fileInput.onchange = function(e) {
    if (e.target.files[0]) processFile(e.target.files[0]);
  };

  ['dragenter', 'dragover'].forEach(function(ev) {
    dropzone.addEventListener(ev, function(e) {
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.add('drag');
    });
  });
  ['dragleave', 'drop'].forEach(function(ev) {
    dropzone.addEventListener(ev, function(e) {
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.remove('drag');
    });
  });
  dropzone.addEventListener('drop', function(e) {
    var file = e.dataTransfer.files[0];
    if (file) processFile(file);
  });

  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.onclick = function() {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
      this.classList.add('active');
      document.querySelector('[data-panel="' + this.dataset.tab + '"]').classList.add('active');
    };
  });

  document.querySelectorAll('.bg-swatch').forEach(function(sw) {
    sw.onclick = function() {
      document.querySelectorAll('.bg-swatch').forEach(function(s) { s.classList.remove('active'); });
      this.classList.add('active');
      var type = this.dataset.bg;
      document.getElementById('gCustom').style.display = 'none';
      document.getElementById('gGradient').style.display = 'none';
      document.getElementById('gUpload').style.display = 'none';
      document.getElementById('gBlur').style.display = 'none';
      if (type === 'custom') document.getElementById('gCustom').style.display = 'block';
      if (type === 'gradient') document.getElementById('gGradient').style.display = 'block';
      if (type === 'upload') document.getElementById('gUpload').style.display = 'block';
      if (type === 'blur') document.getElementById('gBlur').style.display = 'block';
      state.bgType = type;
      render();
      pushHistory();
    };
  });

  document.getElementById('customColor').oninput = function() { state.customColor = this.value; render(); };
  document.getElementById('gradFrom').oninput = function() { state.gradFrom = this.value; render(); };
  document.getElementById('gradTo').oninput = function() { state.gradTo = this.value; render(); };
  document.getElementById('blurRange').oninput = function() {
    state.blurAmount = parseInt(this.value);
    document.getElementById('blurVal').textContent = this.value;
    render();
  };
  document.getElementById('bgImageInput').onchange = function(e) {
    var f = e.target.files[0]; if (!f) return;
    var img = new Image();
    img.onload = function() { state.bgImage = img; render(); };
    img.src = URL.createObjectURL(f);
  };
  document.getElementById('scaleRange').oninput = function() {
    state.scale = parseInt(this.value);
    document.getElementById('scaleVal').textContent = this.value;
    render();
  };
  document.getElementById('posX').oninput = function() { state.posX = parseInt(this.value); render(); };
  document.getElementById('posY').oninput = function() { state.posY = parseInt(this.value); render(); };
  document.getElementById('enhanceToggle').onchange = function() { state.enhance = this.checked; render(); };
  document.getElementById('sharpRange').oninput = function() {
    state.sharpness = parseInt(this.value);
    document.getElementById('sharpVal').textContent = this.value;
    render();
  };
  document.getElementById('contrastRange').oninput = function() {
    state.contrast = parseInt(this.value);
    document.getElementById('contrastVal').textContent = this.value;
    render();
  };
  document.getElementById('satRange').oninput = function() {
    state.saturation = parseInt(this.value);
    document.getElementById('satVal').textContent = this.value;
    render();
  };
  document.getElementById('haloToggle').onchange = function() { state.haloRemoval = this.checked; render(); };
  document.getElementById('featherToggle').onchange = function() { state.feather = this.checked; render(); };
  document.getElementById('upscaleSel').onchange = function() {
    state.upscale = parseInt(this.value);
    render();
  };
  document.getElementById('exportFormat').onchange = function() { state.exportFormat = this.value; };
  document.getElementById('qualityRange').oninput = function() {
    state.jpgQuality = parseInt(this.value) / 100;
    document.getElementById('qualityVal').textContent = this.value;
  };
  document.getElementById('dlBtn').onclick = download;
  document.getElementById('dlPrintBtn').onclick = printImage;
  document.getElementById('toolBrush').onclick = function() { toggleBrush('erase'); };
  document.getElementById('toolRestore').onclick = function() { toggleBrush('restore'); };
  document.getElementById('toolUndo').onclick = undo;
  document.getElementById('toolRedo').onclick = redo;
  document.getElementById('toolCompare').onclick = compare;
  document.getElementById('toolZoomIn').onclick = function() { setZoom(state.zoom + 0.25); };
  document.getElementById('toolZoomOut').onclick = function() { setZoom(state.zoom - 0.25); };
  document.getElementById('toolNew').onclick = newPhoto;
  document.getElementById('brushSize').oninput = function() {
    state.brushSize = parseInt(this.value);
    document.getElementById('brushSizeVal').textContent = this.value;
  };

  mainCanvas.addEventListener('mousedown', startBrush);
  mainCanvas.addEventListener('mousemove', moveBrush);
  mainCanvas.addEventListener('mouseup', endBrush);
  mainCanvas.addEventListener('mouseleave', endBrush);
  mainCanvas.addEventListener('touchstart', function(e) { e.preventDefault(); startBrush(e.touches[0]); }, { passive: false });
  mainCanvas.addEventListener('touchmove', function(e) { e.preventDefault(); moveBrush(e.touches[0]); }, { passive: false });
  mainCanvas.addEventListener('touchend', endBrush);
});

function processFile(file) {
  if (file.type.indexOf('image/') !== 0) { alert('Sirf image files.'); return; }
  if (file.size > 50 * 1024 * 1024) { alert('Max 50MB.'); return; }
  if (!removeBgFn) { alert('Model load ho raha hai. Wait karo.'); return; }

  var mode = MODES[currentMode];
  var startTime = Date.now();
  log('=== Mode: ' + currentMode.toUpperCase() + ' ===');
  log('File: ' + file.name + ' (' + Math.round(file.size/1024) + 'KB)');

  statusEl.textContent = '🔄 Step 1/3: Prepare...';
  statusEl.className = 'status';
  progress.classList.add('active');
  progressFill.style.width = '5%';
  dropzone.style.display = 'none';

  var originalImg = new Image();
  originalImg.onload = function() {
    state.originalImage = originalImg;
    log('Original: ' + originalImg.width + 'x' + originalImg.height);
    statusEl.textContent = '🔄 Step 2/3: AI processing (' + currentMode + ')...';
    progressFill.style.width = '15%';

    compressImage(originalImg, mode.processSize).then(function(blob) {
      log('✅ Compressed: ' + Math.round(blob.size/1024) + 'KB');
      progressFill.style.width = '25%';
      return removeBgFn(blob, {
        model: mode.model,
        output: { format: 'image/png', quality: 1.0 },
        progress: function(key, current, total) {
          var pct = 25 + Math.round((current / total) * 50);
          progressFill.style.width = Math.min(pct, 75) + '%';
          if (key.indexOf('fetch') !== -1) {
            statusEl.textContent = '📥 Model: ' + Math.round(current/1024/1024) + 'MB';
          } else {
            statusEl.textContent = '🔄 AI processing...';
          }
        }
      });
    }).then(function(cutoutBlob) {
      log('✅ BG removed');
      progressFill.style.width = '85%';
      statusEl.textContent = '🔄 Step 3/3: Enhance...';
      return processCutout(cutoutBlob, originalImg, mode);
    }).then(function(finalCanvas) {
      var elapsed = Math.round((Date.now() - startTime) / 1000);
      log('✅ Complete in ' + elapsed + 's (' + currentMode + ')');
      progressFill.style.width = '100%';
      state.cutoutImage = finalCanvas;
      mainCanvas.width = finalCanvas.width;
      mainCanvas.height = finalCanvas.height;
      setTimeout(function() {
        progress.classList.remove('active');
        dropzone.style.display = 'none';
        editor.classList.add('active');
        statusEl.textContent = '✅ Ready in ' + elapsed + 's! (' + currentMode + ')';
        statusEl.className = 'status success';
        render();
        pushHistory();
      }, 300);
    }).catch(function(err) {
      log('❌ ' + err.message);
      statusEl.textContent = '❌ ' + err.message;
      statusEl.className = 'status error';
      progress.classList.remove('active');
      dropzone.style.display = 'block';
      alert('Error: ' + err.message);
    });
  };
  originalImg.onerror = function() {
    alert('Image load failed.');
    dropzone.style.display = 'block';
  };
  originalImg.src = URL.createObjectURL(file);
}

function compressImage(img, maxSize) {
  return new Promise(function(resolve, reject) {
    var w = img.width, h = img.height;
    var ratio = Math.min(maxSize / w, maxSize / h, 1);
    var nw = Math.round(w * ratio), nh = Math.round(h * ratio);
    var c = document.createElement('canvas');
    c.width = nw; c.height = nh;
    var ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, nw, nh);
    c.toBlob(function(blob) {
      if (!blob) { reject(new Error('Compress failed')); return; }
      resolve(blob);
    }, 'image/jpeg', 0.95);
  });
}

function processCutout(cutoutBlob, originalImg, mode) {
  return new Promise(function(resolve, reject) {
    var img = new Image();
    img.onload = function() {
      var srcW = img.width, srcH = img.height;
      var c1 = document.createElement('canvas');
      c1.width = srcW; c1.height = srcH;
      var ctx1 = c1.getContext('2d');
      ctx1.drawImage(img, 0, 0);
      var imageData = ctx1.getImageData(0, 0, srcW, srcH);
      if (state.haloRemoval) removeHalo(imageData, srcW, srcH);
      if (state.feather) featherEdges(imageData, srcW, srcH);
      ctx1.putImageData(imageData, 0, 0);

      var factor = state.enhance ? state.upscale : 1;
      var targetW = Math.round(originalImg.width * factor);
      var targetH = Math.round(originalImg.height * factor);
      var maxDim = 4096;
      if (targetW > maxDim || targetH > maxDim) {
        var r = Math.min(maxDim / targetW, maxDim / targetH);
        targetW = Math.round(targetW * r);
        targetH = Math.round(targetH * r);
      }
      log('Output: ' + targetW + 'x' + targetH);

      var c2 = document.createElement('canvas');
      c2.width = targetW; c2.height = targetH;
      var ctx2 = c2.getContext('2d');
      ctx2.imageSmoothingEnabled = true;
      ctx2.imageSmoothingQuality = 'high';
      if (state.enhance) {
        var contrast = 1 + (state.contrast / 100);
        var sat = 1 + (state.saturation / 100);
        ctx2.filter = 'contrast(' + contrast + ') saturate(' + sat + ')';
      }
      ctx2.drawImage(c1, 0, 0, targetW, targetH);
      ctx2.filter = 'none';
      if (state.enhance && state.sharpness > 0) {
        applySharpen(ctx2, targetW, targetH, state.sharpness);
      }
      resolve(c2);
    };
    img.onerror = function() { reject(new Error('Process failed')); };
    img.src = URL.createObjectURL(cutoutBlob);
  });
}

function removeHalo(imageData, w, h) {
  var data = imageData.data;
  var copy = new Uint8ClampedArray(data);
  for (var y = 2; y < h - 2; y++) {
    for (var x = 2; x < w - 2; x++) {
      var idx = (y * w + x) * 4;
      var alpha = copy[idx + 3];
      if (alpha > 20 && alpha < 235) {
        var rS = 0, gS = 0, bS = 0, cnt = 0;
        for (var dy = -2; dy <= 2; dy++) {
          for (var dx = -2; dx <= 2; dx++) {
            var nIdx = ((y + dy) * w + (x + dx)) * 4;
            if (copy[nIdx + 3] > 240) {
              rS += copy[nIdx]; gS += copy[nIdx + 1]; bS += copy[nIdx + 2]; cnt++;
            }
          }
        }
        if (cnt > 0) {
          data[idx] = rS / cnt; data[idx + 1] = gS / cnt; data[idx + 2] = bS / cnt;
        }
      }
    }
  }
}

function featherEdges(imageData, w, h) {
  var data = imageData.data;
  var copy = new Uint8ClampedArray(data);
  for (var y = 1; y < h - 1; y++) {
    for (var x = 1; x < w - 1; x++) {
      var idx = (y * w + x) * 4;
      var a = copy[idx + 3];
      if (a > 10 && a < 245) {
        var s = 0, c = 0;
        for (var dy = -1; dy <= 1; dy++) {
          for (var dx = -1; dx <= 1; dx++) {
            var nIdx = ((y + dy) * w + (x + dx)) * 4;
            s += copy[nIdx + 3]; c++;
          }
        }
        data[idx + 3] = s / c;
      }
    }
  }
}

function applySharpen(ctx, w, h, amount) {
  var imageData = ctx.getImageData(0, 0, w, h);
  var data = imageData.data;
  var copy = new Uint8ClampedArray(data);
  var strength = amount / 100;
  for (var y = 1; y < h - 1; y++) {
    for (var x = 1; x < w - 1; x++) {
      var idx = (y * w + x) * 4;
      if (copy[idx + 3] < 10) continue;
      for (var ch = 0; ch < 3; ch++) {
        var c = copy[idx + ch];
        var avg = (copy[((y-1)*w+x)*4+ch] + copy[((y+1)*w+x)*4+ch] + copy[(y*w+(x-1))*4+ch] + copy[(y*w+(x+1))*4+ch]) / 4;
        data[idx + ch] = Math.max(0, Math.min(255, c + (c - avg) * strength));
      }
    }
  }
  ctx.putImageData(imageData, 0, 0);
}

function render() {
  if (!state.cutoutImage) return;
  var w = state.cutoutImage.width, h = state.cutoutImage.height;
  mainCanvas.width = w;
  mainCanvas.height = h;
  var ctx = mainCanvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  drawBg(ctx, w, h);
  var sw = w * (state.scale / 100), sh = h * (state.scale / 100);
  var sx = (w - sw) / 2 + (state.posX / 100) * w;
  var sy = (h - sh) / 2 + (state.posY / 100) * h;
  ctx.drawImage(state.cutoutImage, sx, sy, sw, sh);
  mainCanvas.style.transform = 'scale(' + state.zoom + ')';
  document.getElementById('zoomLevel').textContent = Math.round(state.zoom * 100) + '%';
}

function drawBg(ctx, w, h) {
  var t = state.bgType;
  if (t === 'transparent') return;
  if (t === 'white') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); return; }
  if (t === 'black') { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h); return; }
  if (t === 'blue') { ctx.fillStyle = '#4a90e2'; ctx.fillRect(0, 0, w, h); return; }
  if (t === 'custom') { ctx.fillStyle = state.customColor; ctx.fillRect(0, 0, w, h); return; }
  if (t === 'gradient') {
    var g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, state.gradFrom);
    g.addColorStop(1, state.gradTo);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    return;
  }
  if (t === 'upload' && state.bgImage) {
    var ir = state.bgImage.width / state.bgImage.height, cr = w / h;
    var dw, dh, dx, dy;
    if (ir > cr) { dh = h; dw = h * ir; dx = (w - dw) / 2; dy = 0; }
    else { dw = w; dh = w / ir; dx = 0; dy = (h - dh) / 2; }
    ctx.drawImage(state.bgImage, dx, dy, dw, dh);
    return;
  }
  if (t === 'blur') {
    ctx.save();
    ctx.filter = 'blur(' + state.blurAmount + 'px)';
    if (state.originalImage) {
      var s = 1.1;
      ctx.drawImage(state.originalImage, (w - w*s)/2, (h - h*s)/2, w*s, h*s);
    }
    ctx.restore();
  }
}

var isBrushing = false, lastX = 0, lastY = 0;

function toggleBrush(mode) {
  if (state.brushMode === mode) {
    state.brushMode = 'none';
    document.getElementById('toolBrush').classList.remove('active');
    document.getElementById('toolRestore').classList.remove('active');
    document.getElementById('brushControls').classList.remove('active');
  } else {
    state.brushMode = mode;
    document.getElementById('toolBrush').classList.toggle('active', mode === 'erase');
    document.getElementById('toolRestore').classList.toggle('active', mode === 'restore');
    document.getElementById('brushControls').classList.add('active');
  }
}

function getPos(e) {
  var rect = mainCanvas.getBoundingClientRect();
  var scaleX = mainCanvas.width / rect.width;
  var scaleY = mainCanvas.height / rect.height;
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

function startBrush(e) {
  if (state.brushMode === 'none') return;
  isBrushing = true;
  var p = getPos(e); lastX = p.x; lastY = p.y;
  drawBrush(p.x, p.y);
}
function moveBrush(e) {
  if (!isBrushing || state.brushMode === 'none') return;
  var p = getPos(e);
  drawLine(lastX, lastY, p.x, p.y);
  lastX = p.x; lastY = p.y;
}
function endBrush() { if (isBrushing) { isBrushing = false; pushHistory(); } }

function drawBrush(x, y) {
  var ctx = mainCanvas.getContext('2d');
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, state.brushSize / 2, 0, Math.PI * 2);
  if (state.brushMode === 'erase') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,1)';
  }
  ctx.fill();
  ctx.restore();
}
function drawLine(x1, y1, x2, y2) {
  var ctx = mainCanvas.getContext('2d');
  ctx.save();
  ctx.lineWidth = state.brushSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (state.brushMode === 'erase') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
  }
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

function setZoom(z) {
  state.zoom = Math.max(0.25, Math.min(5, z));
  mainCanvas.style.transform = 'scale(' + state.zoom + ')';
  document.getElementById('zoomLevel').textContent = Math.round(state.zoom * 100) + '%';
}

function compare() {
  if (!state.originalImage) return;
  var src = state.originalImage.src;
  var temp = new Image();
  temp.onload = function() {
    var ctx = mainCanvas.getContext('2d');
    ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
    ctx.drawImage(temp, 0, 0, mainCanvas.width, mainCanvas.height);
    setTimeout(render, 1500);
  };
  temp.src = src;
}

function pushHistory() {
  try {
    var data = mainCanvas.toDataURL('image/png');
    state.history = state.history.slice(0, state.historyIndex + 1);
    state.history.push(data);
    if (state.history.length > 15) state.history.shift();
    state.historyIndex = state.history.length - 1;
  } catch (e) {}
}
function undo() { if (state.historyIndex > 0) { state.historyIndex--; restoreHistory(); } }
function redo() { if (state.historyIndex < state.history.length - 1) { state.historyIndex++; restoreHistory(); } }
function restoreHistory() {
  var data = state.history[state.historyIndex];
  var img = new Image();
  img.onload = function() {
    var ctx = mainCanvas.getContext('2d');
    ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
    ctx.drawImage(img, 0, 0);
  };
  img.src = data;
}

function newPhoto() {
  editor.classList.remove('active');
  dropzone.style.display = 'block';
  state = {
    originalImage: null, cutoutImage: null,
    bgType: 'transparent', customColor: '#4a90e2',
    gradFrom: '#667eea', gradTo: '#764ba2',
    bgImage: null, blurAmount: 15,
    scale: 100, posX: 0, posY: 0,
    enhance: MODES[currentMode].enhance, sharpness: 25,
    contrast: 6, saturation: 8,
    haloRemoval: true, feather: true,
    upscale: MODES[currentMode].upscale, exportFormat: 'png', jpgQuality: 0.95,
    brushMode: 'none', brushSize: 30, zoom: 1,
    history: [], historyIndex: -1
  };
  document.querySelectorAll('.bg-swatch').forEach(function(s, i) {
    s.classList.toggle('active', i === 0);
  });
  fileInput.value = '';
  statusEl.textContent = 'Ready. Upload karein.';
  statusEl.className = 'status';
  log('New photo');
}

function download() {
  var format = state.exportFormat;
  var mime = format === 'jpg' ? 'image/jpeg' : (format === 'webp' ? 'image/webp' : 'image/png');
  var ext = format === 'jpg' ? 'jpg' : (format === 'webp' ? 'webp' : 'png');
  var c = document.createElement('canvas');
  c.width = mainCanvas.width;
  c.height = mainCanvas.height;
  var ctx = c.getContext('2d');
  if (format === 'jpg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
  ctx.drawImage(mainCanvas, 0, 0);
  var quality = format === 'png' ? 1.0 : state.jpgQuality;
  c.toBlob(function(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'qunvero-' + Date.now() + '.' + ext;
    a.click();
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    log('✅ Downloaded');
  }, mime, quality);
}

function printImage() {
  var dataUrl = mainCanvas.toDataURL('image/png');
  var win = window.open('');
  win.document.write('<html><head><title>Print</title></head><body style="margin:0"><img src="' + dataUrl + '" style="width:100%"></body></html>');
  win.document.close();
  setTimeout(function() { win.print(); }, 300);
}
</script>
