<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SmartSheet Studio</title>
  <link rel="stylesheet" href="smartsheet-studio/main.css" />
</head>
<body>

  <header class="app-header">
    <div class="app-title">SmartSheet Studio</div>
    <div class="app-subtitle">Phase 2 — Multiple Sheets</div>
  </header>

  <div class="formula-bar">
    <div class="cell-ref" id="cellRef">A1</div>
    <div class="formula-input" id="formulaInput">—</div>
  </div>

  <main class="grid-container">
    <div class="grid-wrapper" id="gridWrapper">
      <table class="sheet-grid" id="sheetGrid"></table>
    </div>
  </main>

  <!-- Sheet tabs bar (NEW in Phase 2) -->
  <div class="sheet-tabs-bar">
    <div class="sheet-tabs" id="sheetTabs"></div>
  </div>

  <footer class="status-bar">
    <span id="statusMessage">Ready</span>
    <span id="statusCell">A1</span>
  </footer>

  <!-- Scripts (order matters!) -->
  <script src="smartsheet-studio/workbook.js"></script>
  <script src="smartsheet-studio/state.js"></script>
  <script src="smartsheet-studio/grid.js"></script>
  <script src="smartsheet-studio/sheets.js"></script>
  <script src="smartsheet-studio/app.js"></script>
</body>
</html>
