<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Private Chat</title>
<style>
  :root{
    --bg:#0b141a; --panel:#111b21; --panel2:#202c33; --bubble-out:#005c4b;
    --bubble-in:#202c33; --text:#e9edef; --muted:#8696a0; --accent:#00a884;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; height:100%; overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); height:100dvh; display:flex; flex-direction:column}
  .screen{display:none; height:100%; width:100%}
  .screen.active{display:flex; flex-direction:column}

  #joinScreen{align-items:center; justify-content:center; padding:24px;
    background:radial-gradient(circle at 50% 30%, #123b32 0%, #0b141a 70%)}
  .join-card{width:100%; max-width:380px; background:var(--panel); border-radius:20px;
    padding:28px 24px; box-shadow:0 20px 60px rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.06)}
  .join-card h1{margin:0 0 8px; font-size:24px; font-weight:700; letter-spacing:-.3px}
  .join-card p{margin:0 0 20px; color:var(--muted); font-size:14px}
  .join-card input{width:100%; padding:14px 16px; font-size:17px; letter-spacing:2px;
    background:var(--panel2); border:1px solid transparent; border-radius:12px;
    color:var(--text); outline:none; text-align:center; font-weight:600}
  .join-card input:focus{border-color:var(--accent)}
  .join-card button{width:100%; margin-top:14px; padding:14px; border:0; border-radius:12px;
    background:var(--accent); color:#fff; font-size:16px; font-weight:600; cursor:pointer}
  .join-card button:active{opacity:.85}
  .join-card button:disabled{opacity:.5}
  .err{color:#ff6b6b; font-size:13px; margin-top:10px; text-align:center; min-height:18px}

  .topbar{display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:var(--panel2); border-bottom:1px solid rgba(255,255,255,.05);
    padding-top:max(10px, env(safe-area-inset-top))}
  .topbar .back{background:transparent; border:0; color:var(--text); font-size:22px; cursor:pointer; padding:4px 6px}
  .avatar{width:40px; height:40px; border-radius:50%; background:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; flex-shrink:0}
  .info{flex:1; min-width:0}
  .info .name{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .info .status{font-size:12px; color:var(--muted)}
  .info .status.online{color:#25d366}
  .menu{background:transparent; border:0; color:var(--muted); font-size:20px; padding:6px}

  .messages{flex:1; overflow-y:auto; padding:14px 12px 8px; display:flex; flex-direction:column; gap:6px;
    -webkit-overflow-scrolling:touch}
  .msg{max-width:78%; padding:8px 12px; border-radius:12px; font-size:15px; line-height:1.35;
    word-wrap:break-word; position:relative; animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .msg.out{align-self:flex-end; background:var(--bubble-out); border-bottom-right-radius:4px}
  .msg.in{align-self:flex-start; background:var(--bubble-in); border-bottom-left-radius:4px}
  .msg .meta{font-size:10px; color:rgba(255,255,255,.6); margin-top:3px; text-align:right; display:flex;
    gap:4px; justify-content:flex-end; align-items:center}
  .msg img.preview{max-width:240px; width:100%; border-radius:8px; display:block; margin-bottom:4px; cursor:pointer}
  .msg .file-row{display:flex; align-items:center; gap:10px; min-width:200px}
  .msg .file-icon{width:38px; height:38px; border-radius:8px; background:rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center; font-size:18px}
  .msg .file-info{flex:1; min-width:0}
  .msg .file-name{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .msg .file-size{font-size:11px; opacity:.7}
  .msg .dl{color:#53bdeb; font-size:12px; text-decoration:none; margin-top:2px; display:inline-block}

  .sys-msg{align-self:center; background:rgba(255,255,255,.06); color:var(--muted);
    padding:5px 12px; border-radius:8px; font-size:12px; margin:4px 0}
  .typing{align-self:flex-start; background:var(--bubble-in); padding:10px 14px;
    border-radius:12px; display:none}
  .typing.show{display:block}
  .typing span{display:inline-block; width:6px; height:6px; border-radius:50%; background:#8696a0;
    margin:0 2px; animation:bounce 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0); opacity:.5} 30%{transform:translateY(-5px); opacity:1}}

  .composer{display:flex; align-items:flex-end; gap:8px; padding:8px 10px;
    background:var(--panel2); border-top:1px solid rgba(255,255,255,.05);
    padding-bottom:max(8px, env(safe-area-inset-bottom))}
  .composer button{background:transparent; border:0; color:var(--muted); font-size:22px; padding:6px; flex-shrink:0}
  .composer button.send{background:var(--accent); color:#fff; border-radius:50%; width:42px; height:42px;
    display:flex; align-items:center; justify-content:center; font-size:18px}
  .composer input[type=text]{flex:1; min-width:0; padding:11px 14px; background:var(--panel);
    border:0; border-radius:22px; color:var(--text); font-size:15px; outline:none}
  .composer input[type=file]{display:none}
  .upload-bar{height:3px; background:var(--panel2); overflow:hidden; display:none}
  .upload-bar.show{display:block}
  .upload-bar .fill{height:100%; width:0%; background:var(--accent); transition:width .2s}

  .lightbox{position:fixed; inset:0; background:rgba(0,0,0,.95); display:none;
    align-items:center; justify-content:center; z-index:1000; padding:20px}
  .lightbox.show{display:flex}
  .lightbox img{max-width:100%; max-height:85%; border-radius:8px}
  .lightbox .close{position:absolute; top:16px; right:16px; color:#fff; font-size:28px; background:none; border:0}
  .lightbox .dl-btn{position:absolute; bottom:24px; background:var(--accent); color:#fff;
    padding:10px 20px; border-radius:20px; text-decoration:none; font-size:14px}

  #toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#202c33;
    color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .3s; z-index:2000; max-width:90%}
  #toast.show{opacity:1}

  @media (max-width:340px){
    .msg{max-width:88%; font-size:14px}
    .join-card{padding:22px 18px}
  }
</style>
</head>
<body>

<!-- JOIN SCREEN -->
<div class="screen active" id="joinScreen">
  <div class="join-card">
    <h1>Private Chat</h1>
    <p>Enter the room code to continue</p>
    <input id="codeInput" type="text" inputmode="numeric" maxlength="8" placeholder="Enter Code" autocomplete="off" />
    <button id="joinBtn">Join Chat</button>
    <div class="err" id="joinErr"></div>
  </div>
</div>

<!-- CHAT SCREEN -->
<div class="screen" id="chatScreen">
  <div class="topbar">
    <button class="back" id="backBtn">←</button>
    <div class="avatar" id="peerAvatar">U</div>
    <div class="info">
      <div class="name">Private Room · 6260</div>
      <div class="status" id="peerStatus">Connecting…</div>
    </div>
    <button class="menu" title="Menu">⋮</button>
  </div>
  <div class="upload-bar" id="uploadBar"><div class="fill" id="uploadFill"></div></div>
  <div class="messages" id="messages">
    <div class="sys-msg">🔒 Room 6260 · Prototype</div>
  </div>
  <div class="composer">
    <button id="emojiBtn" title="Emoji">😊</button>
    <input type="text" id="msgInput" placeholder="Message" autocomplete="off" />
    <button id="attachBtn" title="Attach">📎</button>
    <input type="file" id="fileInput" accept="image/*" />
    <button class="send" id="sendBtn" title="Send">➤</button>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="close" id="lbClose">✕</button>
  <img id="lbImg" src="" alt="" />
  <a class="dl-btn" id="lbDl" download="image.jpg">Download</a>
</div>

<div id="toast"></div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, addDoc, onSnapshot, query,
  orderBy, serverTimestamp, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ==== FIREBASE CONFIG ====
const firebaseConfig = {
  apiKey: "AIzaSyAytf4R-0NZiFTRJsviuvBjyKNwSbCCAZE",
  authDomain: "qunverio.firebaseapp.com",
  databaseURL: "https://qunverio-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "qunverio",
  storageBucket: "qunverio.firebasestorage.app",
  messagingSenderId: "971243140885",
  appId: "1:971243140885:web:407ce3f1dc642635e1db1c"
};

const ROOM_CODE = "6266";
const MAX_IMAGE_KB = 700;   // Firestore per-doc limit ~1MB, so 700KB safe
const NAMESPACE = "chat_test_rooms";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const msgBox = $("messages");

let MY_ID = null;
let MY_NAME = "User";
let unsubMessages = null;
let unsubPresence = null;
let heartbeatTimer = null;
let typingTimer = null;
let myPresenceRef = null;

function toast(msg, ms=2600){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), ms);
}
function fmtTime(d){ return new Date(d).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); }
function fmtSize(b){ if(!b) return ""; if(b<1024) return b+" B"; if(b<1048576) return (b/1024).toFixed(1)+" KB"; return (b/1048576).toFixed(2)+" MB"; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ==== AUTH ====
onAuthStateChanged(auth, (user) => {
  if (user) {
    MY_ID = user.uid;
    MY_NAME = "User " + MY_ID.slice(0, 4).toUpperCase();
  }
});

(async () => {
  try {
    await signInAnonymously(auth);
  } catch(e) {
    console.error(e);
    $("joinErr").textContent = "Auth failed. Enable Anonymous sign-in.";
  }
})();

// ==== JOIN ====
$("joinBtn").onclick = join;
$("codeInput").addEventListener("keydown", e => { if(e.key==="Enter") join(); });

async function join(){
  const code = $("codeInput").value.trim();
  $("joinErr").textContent = "";
  if (!code) return ($("joinErr").textContent = "Please enter a room code");
  if (code !== ROOM_CODE) return ($("joinErr").textContent = "Invalid room code");
  if (!MY_ID) return ($("joinErr").textContent = "Connecting… try again");

  $("joinBtn").disabled = true;
  $("joinBtn").textContent = "Joining…";

  try {
    const presenceCol = collection(db, NAMESPACE, ROOM_CODE, "presence");
    const snap = await getDocs(presenceCol);
    const now = Date.now();
    const activeUsers = snap.docs.filter(d => {
      const data = d.data();
      return data.online && (now - (data.lastSeen || 0) < 60000);
    });

    const iAmActive = activeUsers.some(d => d.id === MY_ID);
    if (activeUsers.length >= 2 && !iAmActive) {
      $("joinBtn").disabled = false;
      $("joinBtn").textContent = "Join Chat";
      return ($("joinErr").textContent = "Room Full");
    }

    await enterChat();
  } catch(e) {
    console.error(e);
    $("joinBtn").disabled = false;
    $("joinBtn").textContent = "Join Chat";
    $("joinErr").textContent = "Server error. Try again.";
  }
}

async function enterChat(){
  $("joinScreen").classList.remove("active");
  $("chatScreen").classList.add("active");

  myPresenceRef = doc(db, NAMESPACE, ROOM_CODE, "presence", MY_ID);
  await setDoc(myPresenceRef, {
    name: MY_NAME, online: true, lastSeen: Date.now(), typing: false
  }, { merge: true });

  heartbeatTimer = setInterval(async () => {
    if (myPresenceRef) {
      await setDoc(myPresenceRef, { lastSeen: Date.now(), online: true }, { merge: true });
    }
  }, 15000);

  const presenceCol = collection(db, NAMESPACE, ROOM_CODE, "presence");
  unsubPresence = onSnapshot(presenceCol, (snap) => {
    const now = Date.now();
    const others = snap.docs.filter(d => {
      const data = d.data();
      return d.id !== MY_ID && data.online && (now - (data.lastSeen || 0) < 60000);
    });

    if (others.length > 0) {
      $("peerStatus").textContent = "online";
      $("peerStatus").classList.add("online");
      const peerTyping = others.some(d => d.data().typing);
      if (peerTyping) showTyping(); else hideTyping();
    } else {
      $("peerStatus").textContent = "waiting for the other person…";
      $("peerStatus").classList.remove("online");
      hideTyping();
    }
  });

  const msgsCol = collection(db, NAMESPACE, ROOM_CODE, "messages");
  const q = query(msgsCol, orderBy("createdAt", "asc"));
  unsubMessages = onSnapshot(q, (snap) => {
    msgBox.innerHTML = '<div class="sys-msg">🔒 Room 6260 · Prototype</div>';
    snap.forEach(d => renderMessage({ id: d.id, ...d.data() }));
    scrollBottom(true);
  });

  document.querySelector(".info .name").textContent = "Private Room · " + ROOM_CODE + " · " + MY_NAME;
}

// ==== RENDER ====
function renderMessage(m){
  const out = m.senderId === MY_ID;
  const el = document.createElement("div");
  el.className = "msg " + (out ? "out" : "in");
  el.dataset.id = m.id;

  let body = "";
  if (m.type === "image" && m.content) {
    body = `<img class="preview" src="${m.content}" alt="image" loading="lazy" data-url="${m.content}" />`;
  } else {
    body = esc(m.content || "");
  }

  const t = m.createdAt?.toDate ? fmtTime(m.createdAt.toDate()) : fmtTime(Date.now());
  const tick = out ? `<span>✓</span>` : "";

  el.innerHTML = `${body}<div class="meta">${t} ${tick}</div>`;
  const img = el.querySelector("img.preview");
  if (img) img.onclick = () => openLightbox(img.dataset.url);
  msgBox.appendChild(el);
}

function scrollBottom(force=false){
  const nearBottom = msgBox.scrollHeight - msgBox.scrollTop - msgBox.clientHeight < 120;
  if (force || nearBottom) msgBox.scrollTop = msgBox.scrollHeight;
}

// ==== SEND TEXT ====
async function sendText(){
  const text = $("msgInput").value.trim();
  if (!text || !MY_ID) return;
  $("msgInput").value = "";
  setTyping(false);

  try {
    await addDoc(collection(db, NAMESPACE, ROOM_CODE, "messages"), {
      senderId: MY_ID, senderName: MY_NAME,
      type: "text", content: text, status: "sent",
      createdAt: serverTimestamp()
    });
  } catch(e) {
    console.error(e);
    toast("Message failed to send");
  }
}
$("sendBtn").onclick = sendText;
$("msgInput").addEventListener("keydown", e => { if(e.key==="Enter") sendText(); });

// ==== TYPING ====
$("msgInput").addEventListener("input", () => {
  if (!MY_ID) return;
  setTyping(true);
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => setTyping(false), 1500);
});
async function setTyping(v){
  if (!myPresenceRef) return;
  try { await setDoc(myPresenceRef, { typing: v }, { merge: true }); } catch(e){}
}
function showTyping(){
  let el = document.querySelector(".typing");
  if (!el) {
    el = document.createElement("div");
    el.className = "typing";
    el.innerHTML = "<span></span><span></span><span></span>";
    msgBox.appendChild(el);
  }
  el.classList.add("show");
  scrollBottom();
}
function hideTyping(){ document.querySelector(".typing")?.classList.remove("show"); }

// ==== IMAGE (Base64 → Firestore) ====
$("attachBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = async (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  if (!f.type.startsWith("image/")) return toast("Only images allowed");
  await sendImage(f);
};

async function compressImage(file, maxKB){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        // Scale down to max 1200px longest side
        const MAX_DIM = 1200;
        let { width, height } = img;
        if (width > MAX_DIM || height > MAX_DIM) {
          if (width > height) { height = Math.round(height * MAX_DIM / width); width = MAX_DIM; }
          else { width = Math.round(width * MAX_DIM / height); height = MAX_DIM; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        let quality = 0.85;
        let dataUrl = canvas.toDataURL("image/jpeg", quality);

        // Reduce quality until under maxKB
        while (dataUrl.length / 1024 > maxKB && quality > 0.2) {
          quality -= 0.1;
          dataUrl = canvas.toDataURL("image/jpeg", quality);
        }
        if (dataUrl.length / 1024 > maxKB) {
          // Last resort: scale further
          const scale = Math.sqrt((maxKB * 1024) / dataUrl.length) * 0.95;
          canvas.width = Math.round(width * scale);
          canvas.height = Math.round(height * scale);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          dataUrl = canvas.toDataURL("image/jpeg", 0.7);
        }
        if (dataUrl.length / 1024 > maxKB) {
          return reject(new Error("Image too large even after compression"));
        }
        resolve(dataUrl);
      };
      img.onerror = () => reject(new Error("Image load failed"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("File read failed"));
    reader.readAsDataURL(file);
  });
}

async function sendImage(file){
  $("uploadBar").classList.add("show");
  $("uploadFill").style.width = "20%";

  try {
    const base64 = await compressImage(file, MAX_IMAGE_KB);
    $("uploadFill").style.width = "70%";

    await addDoc(collection(db, NAMESPACE, ROOM_CODE, "messages"), {
      senderId: MY_ID, senderName: MY_NAME,
      type: "image", content: base64,
      status: "sent", createdAt: serverTimestamp()
    });

    $("uploadFill").style.width = "100%";
    setTimeout(() => { $("uploadBar").classList.remove("show"); $("uploadFill").style.width = "0%"; }, 400);
  } catch(e) {
    console.error(e);
    $("uploadBar").classList.remove("show");
    $("uploadFill").style.width = "0%";
    toast(e.message || "Image send failed");
  }
}

// ==== LIGHTBOX ====
function openLightbox(url){
  $("lbImg").src = url; $("lbDl").href = url;
  $("lightbox").classList.add("show");
}
$("lbClose").onclick = () => $("lightbox").classList.remove("show");
$("lightbox").onclick = (e) => { if (e.target.id === "lightbox") $("lightbox").classList.remove("show"); };

// ==== EMOJI ====
const EMOJIS = ["😀","😂","🥰","😍","😎","🤔","👍","🙏","❤️","🔥","🎉","😢","😡","🤝","👋","💯","✅","⭐","🌹","🍕"];
$("emojiBtn").onclick = () => {
  const picker = document.createElement("div");
  picker.style.cssText = "position:fixed;bottom:70px;left:10px;right:10px;max-width:360px;background:#202c33;padding:10px;border-radius:12px;display:grid;grid-template-columns:repeat(8,1fr);gap:6px;z-index:500;box-shadow:0 8px 30px rgba(0,0,0,.5)";
  EMOJIS.forEach(e => {
    const b = document.createElement("button");
    b.textContent = e; b.style.cssText = "font-size:22px;background:transparent;border:0;padding:6px;cursor:pointer";
    b.onclick = () => { $("msgInput").value += e; $("msgInput").focus(); picker.remove(); };
    picker.appendChild(b);
  });
  document.body.appendChild(picker);
  setTimeout(() => {
    const close = (ev) => { if (!picker.contains(ev.target) && ev.target !== $("emojiBtn")) { picker.remove(); document.removeEventListener("click", close); } };
    document.addEventListener("click", close);
  }, 100);
};

// ==== LEAVE ====
$("backBtn").onclick = async () => {
  if (!confirm("Leave the chat?")) return;
  await cleanup();
  location.reload();
};
window.addEventListener("beforeunload", () => {
  if (myPresenceRef) setDoc(myPresenceRef, { online: false, typing: false }, { merge: true });
});

async function cleanup(){
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  if (myPresenceRef) {
    try { await setDoc(myPresenceRef, { online: false, typing: false }, { merge: true }); } catch(e){}
  }
  unsubMessages?.(); unsubPresence?.();
}
</script>
</body>
</html>
