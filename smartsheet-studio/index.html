<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SmartSheet Studio</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="app-title">SmartSheet Studio</div>
    <div class="app-subtitle">Phase 1 — Grid Foundation</div>
  </header>

  <!-- Formula Bar (read-only in Phase 1) -->
  <div class="formula-bar">
    <div class="cell-ref" id="cellRef">A1</div>
    <div class="formula-input" id="formulaInput">—</div>
  </div>

  <!-- Spreadsheet Grid Container -->
  <main class="grid-container">
    <div class="grid-wrapper" id="gridWrapper">
      <table class="sheet-grid" id="sheetGrid">
        <!-- Grid rendered by JS -->
      </table>
    </div>
  </main>

  <!-- Status Bar -->
  <footer class="status-bar">
    <span id="statusMessage">Ready</span>
    <span id="statusCell">A1</span>
  </footer>

  <!-- Scripts -->
  <script src="js/state.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
